fail_fast = true

# prek の builtin フック（オフライン・依存なし）
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "detect-private-key" },
  { id = "check-toml" },
]

# Rust 関連のローカルフック（priority の昇順で逐次実行）
[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    entry = "cargo fmt --all -- --check",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 0,
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    entry = "cargo clippy --workspace --all-targets -- -D warnings",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 10,
  },
  {
    id = "cargo-test",
    name = "cargo test",
    entry = "cargo test --workspace",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 20,
  },
]
