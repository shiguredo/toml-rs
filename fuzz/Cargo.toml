[package]
name = "fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
shiguredo_toml = { path = ".." }

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
doc = false

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
doc = false

[[bin]]
name = "fuzz_edit"
path = "fuzz_targets/fuzz_edit.rs"
doc = false

[[bin]]
name = "fuzz_edit_arb"
path = "fuzz_targets/fuzz_edit_arb.rs"
doc = false

[[bin]]
name = "fuzz_value_path"
path = "fuzz_targets/fuzz_value_path.rs"
doc = false

[[bin]]
name = "fuzz_serializer"
path = "fuzz_targets/fuzz_serializer.rs"
doc = false

[[bin]]
name = "fuzz_parse_v1_1"
path = "fuzz_targets/fuzz_parse_v1_1.rs"
doc = false
