[package]
name = "fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
doc = false
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"

[[bin]]
doc = false
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"

[[bin]]
doc = false
name = "fuzz_edit"
path = "fuzz_targets/fuzz_edit.rs"

[[bin]]
doc = false
name = "fuzz_edit_arb"
path = "fuzz_targets/fuzz_edit_arb.rs"

[[bin]]
doc = false
name = "fuzz_value_path"
path = "fuzz_targets/fuzz_value_path.rs"

[[bin]]
doc = false
name = "fuzz_serializer"
path = "fuzz_targets/fuzz_serializer.rs"

[[bin]]
doc = false
name = "fuzz_parse_v1_1"
path = "fuzz_targets/fuzz_parse_v1_1.rs"

[dependencies]
# fuzz ターゲット用の任意バイト列から構造化入力へのデコード
arbitrary = { version = "1", features = ["derive"] }
# libFuzzer との結合（cargo-fuzz のターゲット定義に必須）
libfuzzer-sys = "0.4"
# 被テストクレート
shiguredo_toml = { path = ".." }
