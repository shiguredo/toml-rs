name: CI

on:
  push:
    paths-ignore:
      - "**.md"
  schedule:
    # JST 11:00 (UTC 02:00), 月-金
    - cron: "0 2 * * 1-5"

jobs:
  ci:
    name: CI
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025-vs2026
          - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml に固定した MSRV のツールチェーンを導入する
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # fuzz と tools はワークスペース外なので、別途フォーマットと lint を確認する
      - name: Check excluded crates
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
          cargo fmt --manifest-path tools/toml-test-adapter/Cargo.toml -- --check
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path tools/toml-test-adapter/Cargo.toml --all-targets -- -D warnings

  toml_test:
    name: toml-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml に固定した MSRV のツールチェーンを導入する
      - run: rustup show
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: Run toml-test (v1.0)
        run: make toml-test-v1_0-ci
      - name: Run toml-test (v1.1)
        run: make toml-test-v1_1-ci

  slack_notify:
    needs: [ci, toml_test]
    timeout-minutes: 5
    runs-on: ubuntu-slim
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: rust-oss
          notify_mode: failure_and_fixed
