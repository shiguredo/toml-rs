[package]
name = "toml_test_adapter"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "toml-test-decoder"
path = "src/bin/toml_test_decoder.rs"

[[bin]]
name = "toml-test-encoder"
path = "src/bin/toml_test_encoder.rs"

[dependencies]
# toml-test の tagged JSON 形式の読み書き
serde_json = "1"
# 被テストクレート
shiguredo_toml = { path = "../.." }
